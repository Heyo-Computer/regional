# Region definition for the regional search stack.
# Everything indexed must fall inside `bbox` (or `polygon`, if set).
# `cities` is the gazetteer: it resolves human place names ("Denver",
# "Grand Junction") to coordinates without any external geocoder call
# on the read path.

name = "Colorado"
slug = "co"
admin_level = "state"
timezone = "America/Denver"

# Colorado is a true rectangle, so the bbox is exact. For a non-rectangular
# region, set `polygon = [[lat, lng], ...]` instead and the same call sites
# emit _geoPolygon(...) rather than _geoBoundingBox(...).
[bbox]
min_lat = 36.992426
min_lng = -109.060253
max_lat = 41.003444
max_lng = -102.041524

[centroid]
lat = 38.997934
lng = -105.550888

# Search vocabulary. Omit this whole table to take the built-in English
# defaults; anything you set here REPLACES the default rather than adding to
# it, so edit these lists rather than appending a single entry.
#
# Synonym groups are bidirectional: every term becomes a synonym of every
# other in its group. These earn their keep — OpenStreetMap tags a winery as
# `craft=winery` while people search for a "vineyard", and tags a `taproom`
# that everyone calls a brewery.
[vocabulary]
stop_words = [
  "a", "an", "and", "at", "for", "in", "is", "it", "near", "of", "on", "or",
  "the", "to", "with", "where",
]
synonyms = [
  ["vineyard", "winery", "wine tasting", "tasting room"],
  ["restaurant", "eatery", "dining", "diner"],
  ["bar", "pub", "tavern"],
  ["brewery", "taproom", "brewpub", "beer garden"],
  ["cafe", "coffee shop", "coffeehouse", "espresso"],
  ["trail", "trailhead", "hiking"],
  ["hotel", "lodging", "motel", "inn"],
  ["museum", "gallery"],
  ["campground", "camping", "campsite"],
  ["hot springs", "hot spring", "thermal springs"],
  ["ski area", "ski resort", "ski hill"],
  # Colorado-specific: a "fourteener" is any peak over 14,000 feet.
  ["fourteener", "14er", "peak", "summit"],
]

[[cities]]
