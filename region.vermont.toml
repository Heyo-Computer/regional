# A worked second region, to show what configuring another place involves.
#
#   docker build -f mcp/Dockerfile --build-arg REGION_FILE=region.vermont.toml .
#   REGION_FILE=region.vermont.toml docker compose up --build
#
# Nothing else in the repo is Colorado-specific — this file is the whole
# difference between the two deployments.

name = "Vermont"
slug = "vt"
admin_level = "state"
timezone = "America/New_York"

[bbox]
min_lat = 42.726853
min_lng = -73.437740
max_lat = 45.016659
max_lng = -71.464555

[centroid]
lat = 43.916
lng = -72.669

# Replaces the built-in defaults wholesale, so the general groups are
# repeated here alongside the ones that only matter in Vermont.
[vocabulary]
stop_words = [
  "a", "an", "and", "at", "for", "in", "is", "it", "near", "of", "on", "or",
  "the", "to", "with", "where",
]
synonyms = [
  ["restaurant", "eatery", "dining", "diner"],
  ["bar", "pub", "tavern"],
  ["brewery", "taproom", "brewpub"],
  ["cafe", "coffee shop", "coffeehouse"],
  ["trail", "trailhead", "hiking"],
  ["hotel", "lodging", "motel", "inn"],
  ["museum", "gallery"],
  ["campground", "camping", "campsite"],
  ["ski area", "ski resort", "ski hill"],
  # Vermont-specific vocabulary.
  ["sugarhouse", "sugar shack", "maple syrup", "sugaring"],
  ["creemee", "soft serve", "ice cream"],
  ["covered bridge", "bridge"],
  ["farm stand", "farmstand", "farm store"],
]

